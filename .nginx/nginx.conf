server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Runtime env for the SPA. env.ts fetches GET /config and merges the
    # JSON into window.env. config.json is generated at container start by
    # /docker-entrypoint.d/40-imbrace-config.sh from VITE_APP_* env vars.
    location = /config {
        default_type application/json;
        try_files /config.json =204;
    }

    # Service worker + manifest must never be cached
    location = /sw.js          { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # Hashed build assets — cache aggressively
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API proxy — the SPA calls the backend via the relative "/api" prefix
    # (in dev this is the Vite proxy; in production nginx does it here).
    # BACKEND_URL is injected at container start by envsubst on this template
    # (default http://localhost:9001 — override with -e BACKEND_URL=...).
    # The trailing slash on proxy_pass strips the "/api" prefix:
    #   /api/platform/v2  ->  $BACKEND_URL/platform/v2
    location /api/ {
        proxy_pass ${BACKEND_URL}/;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    # ActivePieces workflow proxy — the SPA calls the relative "/ap-workflow"
    # prefix (in dev this is the Vite proxy; in production nginx does it here).
    # APWF_URL is injected at container start by envsubst on this template
    # (override with -e APWF_URL=...).
    # The trailing slash on proxy_pass strips the "/ap-workflow" prefix:
    #   /ap-workflow/api/v1/flows  ->  $APWF_URL/api/v1/flows
    location /ap-workflow/ {
        proxy_pass ${APWF_URL}/;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    # SPA fallback — every unknown path serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
